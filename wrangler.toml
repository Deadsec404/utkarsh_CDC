# ==============================================================================
# Cloudflare Workers Configuration for Utkarsh Child Development Centre
# ==============================================================================

name = "utkarsh-cdc-web"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------------------------------------------
# 1. Static Assets (Vite React Single Page Application)
# Serves the compiled files from dist/ with SPA client routing fallback
# ------------------------------------------------------------------------------
[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

# ------------------------------------------------------------------------------
# 2. Cloudflare D1 Database Binding (Where all your leads are stored permanently)
# To create the database in your Cloudflare account, run:
#   npx wrangler d1 create utkarsh_leads_db
# Then replace database_id below with the ID returned by Wrangler.
# ------------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "utkarsh_leads_db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ------------------------------------------------------------------------------
# 3. Environment Variables (Public/Default settings)
# ------------------------------------------------------------------------------
[vars]
ADMIN_USERNAME = "admin"
ADMIN_NOTIFICATION_EMAIL = "swapnilbibrale9@gmail.com"
SMTP_PORT = "587"

# ------------------------------------------------------------------------------
# Note: For sensitive secrets (ADMIN_PASSWORD, SMTP_PASS, RESEND_API_KEY),
# configure them securely using Wrangler secrets:
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put SMTP_HOST
#   npx wrangler secret put SMTP_USER
#   npx wrangler secret put SMTP_PASS
# ------------------------------------------------------------------------------
